name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    name: Pint + Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - name: Pint (linter)
        run: ./vendor/bin/pint --test
      - name: Pest
        run: ./vendor/bin/pest
