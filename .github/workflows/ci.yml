name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    name: Pint + PHPStan + Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - name: Pint (linter)
        run: ./vendor/bin/pint --test
      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Pest
        run: ./vendor/bin/pest

      # Este paquete lo instalan los 11 sistemas municipales: un aviso de
      # seguridad suyo se reparte por todo el ecosistema. Bloquea a propósito
      # -sin `|| true`-: un job que informa y no corta lo lee nadie.
      - name: Auditoría de dependencias (composer audit)
        run: composer audit --no-dev --format=plain

  # La misma suite contra el motor de producción del ecosistema.
  #
  # No es redundante con el job de arriba: la corrida en SQLite estuvo verde
  # mientras `Bitacora::desvincular()` fallaba SIEMPRE en MariaDB —la retención
  # entera caída en producción— porque Laravel compila `cast(? as json)` para el
  # UPDATE de una ruta JSON y MariaDB no soporta `CAST AS JSON`. La diferencia de
  # motor es la que ve esa clase de defecto; ninguna revisión de código la vio.
  test-mariadb:
    name: Pest sobre MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: prueba
        ports:
          - 33061:3306
        options: >-
          --health-cmd="mariadb-admin ping -h127.0.0.1 --protocol=tcp -uroot -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - name: Pest (MariaDB)
        env:
          MUNI_MARIADB_HOST: 127.0.0.1
          MUNI_MARIADB_PORT: 33061
        run: ./vendor/bin/pest

      # Este job no puede probar su propio nombre. Sin la variable, la suite
      # corre en SQLite, imprime «3 skipped» y sale con 0: el mismo verde que
      # este job imprimiría si alguien renombrara o borrara `MUNI_MARIADB_HOST`
      # del paso de arriba. Así que la evidencia se busca donde no se puede
      # fingir: en el servidor. Si la suite corrió de verdad contra él, la base
      # `prueba` quedó con las tablas del módulo y con los dos triggers del
      # guardia de inmutabilidad instalados por las migraciones.
      #
      # Con el cliente de la imagen oficial y no con el del runner, que no
      # garantiza traer ninguno.
      - name: La corrida usó MariaDB de verdad
        run: |
          set -euo pipefail
          consultar() {
            docker run --rm --network host mariadb:11 \
              mariadb -h127.0.0.1 -P33061 --protocol=tcp -uroot -psecret -N -B -e "$1"
          }
          tablas=$(consultar "select count(*) from information_schema.tables
            where table_schema='prueba'
              and table_name in ('privacidad_bitacora','privacidad_textos');")
          triggers=$(consultar "select count(*) from information_schema.triggers
            where trigger_schema='prueba'
              and trigger_name in ('privacidad_bitacora_inmutable_bu','privacidad_textos_inmutable_bu');")
          echo "tablas=$tablas triggers=$triggers"
          if [ "$tablas" != "2" ] || [ "$triggers" != "2" ]; then
            echo "::error::La suite NO corrió contra MariaDB: la base «prueba» no tiene el esquema del módulo." >&2
            echo "Revisar que el paso «Pest (MariaDB)» siga exportando MUNI_MARIADB_HOST y que TestCase la siga leyendo." >&2
            exit 1
          fi
