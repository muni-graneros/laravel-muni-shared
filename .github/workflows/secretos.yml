name: Secretos

# Escaneo de secretos (gitleaks) en un workflow propio: corre en todo push y PR,
# también cuando solo cambia documentación. Los 11 sistemas municipales instalan
# este paquete; una credencial que entre acá viaja a cada vendor/.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # sin el historial completo, `gitleaks git` no ve nada

      # Binario oficial con versión fijada, verificado contra la lista de checksums
      # de la misma release antes de ejecutarlo.
      - name: Instalar gitleaks
        env:
          VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sfLO "${base}/${tarball}"
          curl -sfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " ${tarball}$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Buscar credenciales en el árbol de trabajo
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml

      - name: Buscar credenciales en el historial
        run: gitleaks git . --no-banner --redact --config .gitleaks.toml
